name: CapMAC Holdings
description: CapMAC Holdings Inc. (Capital Markets Assurance Corporation) was a New York-based holding
  company that provided financial guaranty and surety insurance for structured securities worldwide,
  primarily asset-backed securities, alongside structured financial solutions, advisory and structuring
  services, and investment management. Founded in 1973 and headquartered at 885 Third Avenue in New York
  City, it was a Canaan Partners portfolio company. MBIA Inc. acquired CapMAC Holdings in a stock swap
  valued at more than $500 million, completing the merger on February 17, 1998, after which CapMAC
  operated as an indirect wholly-owned MBIA subsidiary. Capital Markets Assurance Corporation was
  merged into MBIA Insurance Corporation during the third quarter of 2010 and ceased to exist as a
  separately licensed insurer. The company is defunct and operates no website, developer program, or
  API surface; the capmac.com domain is an unrelated parked domain listed for sale.
